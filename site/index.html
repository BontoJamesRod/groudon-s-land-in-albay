<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mayon Radar Watch</title>
  <link rel="stylesheet" href="vendor/leaflet-1.9.4/leaflet.css">
  <link rel="stylesheet" href="css/app.css?v=3c2da55400">
</head>
<body>
  <!-- The text of these elements comes from js/strings.js. -->
  <header class="topbar">
    <span class="brand">
      <!-- Our own mark: a volcano with two radar waves. -->
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M1.5 21.5 9.5 8.5h3l8 13z" fill="currentColor"/><path d="M15 5.2a4 4 0 0 1 3.8 3.8M15.2 1.8a7.4 7.4 0 0 1 7 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="brand-name" data-text="appName"></span>
    </span>
    <h1 class="site-title"><button id="site-name" class="site-name" type="button" data-text="appName"></button></h1>
    <button id="search-button" class="search-box" type="button"><span class="search-box-text" data-text="searchBox"></span></button>
    <button id="channels-button" type="button" data-text="channelsButton" hidden></button>
    <div class="disclaimer-tag">
      <span id="disclaimer-short" data-text="disclaimerShort"></span>
      <span data-info="disclaimer"><p class="disclaimer" data-text="disclaimer"></p></span>
    </div>
    <button id="help-button" class="round-button" type="button" data-label="helpButton"><span aria-hidden="true">?</span></button>
  </header>

  <div class="map-row">
  <main class="map-area">
    <div id="map" role="region" data-label="mapLabel"></div>
    <p id="loading" class="map-notice" role="status" data-text="loadingRadar"></p>
    <p id="background-notice" class="map-notice notice-low" role="status" data-text="backgroundUnavailable" hidden></p>

    <div id="compare-view" class="compare-view" hidden>
      <span id="compare-before" class="compare-label compare-label-before"></span>
      <span id="compare-after" class="compare-label compare-label-after"></span>
      <button id="compare-close" class="compare-close" type="button" data-text="close"></button>
      <div id="compare-divider" class="compare-divider" role="slider" tabindex="0"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" data-label="compareDivider"></div>
    </div>

    <section id="search-panel" class="floating-card search-panel" hidden>
      <form id="search-form" class="search-form" role="search">
        <input id="search-input" type="search" autocomplete="off" data-label="searchField">
        <button type="submit" data-text="searchSubmit"></button>
        <button id="search-close" type="button" data-text="close"></button>
      </form>
      <p id="search-message" aria-live="polite"></p>
      <ul id="search-suggestions" class="search-suggestions"></ul>
    </section>

    <section id="readout-card" class="floating-card readout-card" aria-live="polite" hidden>
      <div id="readout-body"></div>
      <div class="card-actions">
        <button id="readout-retry" type="button" data-text="retry" hidden></button>
        <button id="readout-close" type="button" data-text="close"></button>
      </div>
    </section>
  </main>

  <div class="side">
  <section id="channel-panel" class="channel-panel" data-label="channelsTitle" hidden>
    <header class="channel-header">
      <button id="channel-back" type="button" data-text="channelBack" hidden></button>
      <h2 id="channel-title" tabindex="-1"></h2>
      <button id="channel-close" type="button" data-text="close"></button>
    </header>
    <p class="channel-status-line" aria-live="polite">
      <span id="channel-status"></span>
      <button id="channel-retry" type="button" data-text="retry" hidden></button>
    </p>
    <div id="channel-body"></div>
  </section>

  <section id="panel" class="panel drawer-closed" data-label="panelLabel" hidden>
    <button id="drawer-toggle" class="drawer-toggle" type="button" aria-expanded="false"></button>
    <div class="timeline">
      <div class="timeline-controls">
        <button id="previous" type="button" data-text="previous"></button>
        <select id="pair-list" data-label="radarPassList"></select>
        <button id="next" type="button" data-text="next"></button>
      </div>
      <div class="pair-line">
        <span id="pair-label" class="pair-label"></span>
        <span data-info="pass"><p id="pair-detail"></p><p id="pair-events" class="pair-events"></p></span>
      </div>
      <p id="pair-gap" class="pair-gap"></p>
      <p class="timeline-status" aria-live="polite">
        <span id="timeline-message"></span>
        <button id="timeline-retry" type="button" data-text="retry" hidden></button>
      </p>
    </div>
    <div class="legend">
      <label class="layer-toggle"><span id="legend-title"></span><input id="layer-toggle" type="checkbox" role="switch" checked></label>
      <div class="legend-key">
        <ul id="legend-rows" class="legend-rows"></ul>
        <span data-info="legend"><p class="legend-colors" data-text="legendColors"></p><ul id="legend-full" class="legend-full"></ul><p id="legend-no-color"></p></span>
      </div>
      <div class="area-line">
        <span id="legend-area" class="legend-area"></span>
        <span data-info="area"><span id="legend-area-more"></span><p class="channel-note" data-text="marksNote"></p></span>
      </div>
      <p id="summary" class="summary"></p>
      <p class="legend-actions">
        <button id="compare-button" type="button" data-text="compareButton"></button>
        <span id="compare-message" aria-live="polite"></span>
      </p>
    </div>
    <div class="histogram">
      <h2 class="histogram-title" data-text="histogramTitle"></h2>
      <div id="histogram-chart"></div>
      <div class="share-line">
        <span id="histogram-share" class="histogram-share"></span>
        <span data-info="chart"><p id="histogram-sentence" class="histogram-sentence"></p><p id="histogram-note" class="histogram-note"></p></span>
      </div>
    </div>
    <div id="channel-legend" class="channel-legend" hidden>
      <div id="channel-layer">
        <label class="layer-toggle"><span data-text="channelLayerLabel"></span><input id="channel-toggle" type="checkbox" role="switch" checked></label>
        <p id="channel-note" class="channel-note" data-text="channelLineNote"></p>
        <p id="channel-sources" class="channel-note" data-text="channelSources"></p>
      </div>
      <p id="channels-unavailable" class="summary" data-text="channelsUnavailable" hidden></p>
    </div>
  </section>
  </div>
  </div>

  <div class="app-status" aria-live="polite">
    <span id="app-message"></span>
    <button id="app-retry" type="button" data-text="retry" hidden></button>
  </div>

  <footer class="footer">
    <span class="footer-links"><button id="sources-button" class="link-button" type="button" data-text="sourcesButton"></button><button id="check-button" class="link-button" type="button" data-text="checkButton"></button></span>
  </footer>

  <dialog id="help-panel" class="panel-dialog">
    <header><h2 data-text="helpButton"></h2><button type="button" data-close data-text="close"></button></header>
    <div data-body></div>
  </dialog>
  <dialog id="sources-panel" class="panel-dialog">
    <header><h2 data-text="sourcesTitle"></h2><button type="button" data-close data-text="close"></button></header>
    <div data-body></div>
  </dialog>
  <dialog id="check-panel" class="panel-dialog">
    <header><h2 data-text="checkTitle"></h2><button type="button" data-close data-text="close"></button></header>
    <div data-body></div>
  </dialog>
  <dialog id="picker-panel" class="panel-dialog">
    <header><h2 data-text="pickerTitle"></h2><button type="button" data-close data-text="close"></button></header>
    <div data-body></div>
  </dialog>

  <script>
    // If a script can't load, the app can't start, and js/strings.js may be the one missing,
    // so this text has to live here. Retry reloads the page, which asks for the scripts again.
    function showStartFailure() {
      document.getElementById("loading").hidden = true;
      // The other buttons get their text from js/strings.js, and can't do anything without the app.
      document.querySelectorAll("button").forEach((button) => { button.hidden = true; });
      document.getElementById("app-message").textContent = "Couldn't load the map. Check your connection and try again.";
      const retry = document.getElementById("app-retry");
      retry.textContent = "Retry";
      retry.hidden = false;
      retry.onclick = () => location.reload();
    }
    // A script that loaded but broke while starting. main.js sets appStarted once they have all run.
    window.addEventListener("error", () => {
      if (!window.appStarted) showStartFailure();
    });
  </script>
  <script src="vendor/leaflet-1.9.4/leaflet.js" onerror="showStartFailure()"></script>
  <script type="importmap">
{
  "imports": {
    "./js/channels.js": "./js/channels.js?v=aeecd97064",
    "./js/compare.js": "./js/compare.js?v=992505293c",
    "./js/data.js": "./js/data.js?v=4dcc91f5d5",
    "./js/drawer.js": "./js/drawer.js?v=7e42d26b68",
    "./js/histogram.js": "./js/histogram.js?v=41b9d489b4",
    "./js/layers.js": "./js/layers.js?v=3f226ddb4b",
    "./js/main.js": "./js/main.js?v=393b841add",
    "./js/map.js": "./js/map.js?v=ca1e65e83a",
    "./js/marks.js": "./js/marks.js?v=954090a74a",
    "./js/panels.js": "./js/panels.js?v=1417279eb1",
    "./js/popover.js": "./js/popover.js?v=120be6e61a",
    "./js/readout.js": "./js/readout.js?v=d38c3583a3",
    "./js/search.js": "./js/search.js?v=49363b9f38",
    "./js/strings.js": "./js/strings.js?v=e5cbb3504c",
    "./js/timeline.js": "./js/timeline.js?v=1cb7defecf"
  }
}
  </script>
  <script type="module" src="js/main.js?v=393b841add" onerror="showStartFailure()"></script>
</body>
</html>
