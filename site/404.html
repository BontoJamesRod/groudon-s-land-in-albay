<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Mayon Radar Watch</title>
  <link rel="icon" href="/img/mrw-logo.svg" type="image/svg+xml">
  <link rel="icon" href="/img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px 16px; color: #1f2328; background: #ffffff; }
    a { display: inline-block; min-height: 44px; line-height: 44px; }
  </style>
</head>
<body>
  <h1>Page not found</h1>
  <p><a id="home" href="/">Back to the map</a></p>
  <script>
    // On GitHub Pages a project site lives at /<repository>/, so point the link there.
    if (location.hostname.endsWith("github.io")) {
      const repo = location.pathname.split("/")[1];
      document.getElementById("home").href = "/" + repo + "/";
      // The icons live there too.
      for (const link of document.querySelectorAll("link[rel*=icon]")) {
        link.href = "/" + repo + link.getAttribute("href");
      }
    }
  </script>
</body>
</html>
