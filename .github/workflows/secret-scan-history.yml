# Task T-007, TC-052: scan the whole Git history for secrets.
# ci.yml only scans new commits, and a merge commit can leave it nothing to scan. Run this
# by hand (Actions > Scan history for secrets) before a release; it also runs every week.
name: Scan history for secrets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
